# One-shot upload job:  docker compose run --rm truedbx [--source /data/x] [--target /Dropbox/Folder]
services:
  truedbx:
    image: ${TDBX_IMAGE:-ghcr.io/shunte88/truedbx:latest}
    build: .
    env_file: .env
    volumes:
      - ${TDBX_HOST_PATH:?set TDBX_HOST_PATH in .env}:/data:ro
    restart: "no"
